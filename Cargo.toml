[package]
name = "typebash"
version = "0.1.0"
edition = "2021"
description = "TypeBash: A strictly typed nadstroika that compiles to safe, bulletproof Bash."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chumsky = "0.9.3"
miette = { version = "7.2", features = ["fancy"] }
colored = "2.1"
indicatif = "0.17"
